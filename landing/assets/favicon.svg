<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RentHUB">
  <!--
    Временный знак вместо заготовки Expo.

    У проекта нет логотипа: assets/icon.png — стандартная синяя «птичка» из
    шаблона, и она же стояла фавиконом сайта. Продукт с чужим дефолтным
    значком выглядит как чей-то тестовый проект, а не как сервис, которому
    отдают вещь за 90 000 ₸.

    Знак собран из того, что у бренда уже есть: кремовая подложка, тёплая
    терракота, геометричная буква и точка из логотипа «RentHUB.». Это не
    замена работе дизайнера — это честная заглушка, которая перестаёт врать
    о происхождении продукта.

    SVG, а не PNG: растеризатора в проекте нет, а браузеры давно понимают
    векторный фавикон. Для иконок приложения PNG всё равно понадобится —
    там вектор не принимают.
  -->
  <rect width="64" height="64" rx="14" fill="#FAF7F2"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#E7E0D6" stroke-width="2"/>
  <path
    d="M18 46V18h14.5c5.8 0 9.5 3.4 9.5 8.6 0 4-2.2 6.9-5.9 8L44 46h-7.4l-6.6-10.2H24.6V46H18zm6.6-15.6h6.8c2.6 0 4.2-1.5 4.2-3.8s-1.6-3.8-4.2-3.8h-6.8v7.6z"
    fill="#1A1917"/>
  <circle cx="49" cy="43" r="3.6" fill="#C2603C"/>
</svg>
