<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Петля сделки RentHUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FAF7F2;
      --ink: #1A1917;
      --muted: #6E675E;
      --accent: #C2603C;
      --rule: rgba(26,25,23,0.12);
      --font: 'Manrope', system-ui, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    p.lead { color: var(--muted); font-size: 0.95rem; font-weight: 500; margin-bottom: 1.5rem; max-width: 62ch; }
    .wrap { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    footer { margin-top: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Петля · RentHUB</p>
    <h1>Каждая сделка возвращается в доверие</h1>
    <p class="lead">Шаги идут по кругу, но продукт держится на центре: закрытая сделка дописывает рейтинг, а рейтинг решает, состоится ли следующая. Без этого центра платформа была бы доской объявлений.</p>

      <rect x="648" y="188" width="160" height="64" rx="8" fill="#FAF7F2" stroke="#1A1917" stroke-width="1"/>

      <text x="584" y="708" fill="#6E675E" font-size="9" font-weight="500" font-family="Manrope, sans-serif">шаг, где появляются деньги</text>

    </div>
    <footer>RentHUB · Кокшетау · пилот без реальных платежей</footer>
