# Публикация сайта при каждом пуше в main.
#
# Зачем. Раньше `docs/` была собранной копией, лежащей в репозитории: чтобы
# сайт догнал код, кто-то должен был вспомнить про `npm run build:pages` и
# закоммитить результат. Забыли — и на живом адресе старая версия при свежем
# коде, а понять это можно только сравнив имена бандлов.
#
# Теперь копию собирает GitHub при пуше. Забыть нечего: если код уехал в
# main, сайт из него и соберётся.
#
# Побочная польза: история перестаёт толстеть. Каждая пересборка добавляла
# в неё бандл на 2 МБ, хотя это производное от исходников, а не исходник.

name: Публикация на Pages

on:
  push:
    branches: [main]
  # Ручной запуск — на случай, когда нужно пересобрать без изменений в коде:
  # например, после смены переменной окружения в настройках репозитория.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации отменяют друг друга: если пушей было два подряд,
# смысл имеет только последний. Без этого они гонятся за одним и тем же
# адресом и выигрывает не обязательно свежий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Значения по умолчанию — публичные по замыслу: адрес проекта и
      # anon-ключ и так вшиты в бандл, который раздаётся каждому посетителю.
      # Держать их здесь честнее, чем требовать ручной настройки: сборка
      # работает сразу после клонирования репозитория.
      #
      # Переопределить (например, после смены ключа) можно переменными:
      # Settings → Secrets and variables → Actions → Variables. Заданная
      # переменная побеждает значение по умолчанию.
      - name: Собрать сайт
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://owfsfwqwulpossjbnprp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_NU7hn1PyfmEXLsOkY1EECg_phBvx0e9' }}
          EXPO_PUBLIC_PILOT_CITY: ${{ vars.EXPO_PUBLIC_PILOT_CITY || 'kokshetau' }}
          EXPO_PUBLIC_AUTH_MODE: ${{ vars.EXPO_PUBLIC_AUTH_MODE || 'sms' }}
          EXPO_PUBLIC_TELEGRAM_BOT: ${{ vars.EXPO_PUBLIC_TELEGRAM_BOT || 'renthub_kokshetau_bot' }}
        run: npm run build:pages

      # Вес сборки: тот самый мегабайт, который качает судья с телефона.
      # Проверяется здесь, а не в общих сверках, потому что до сборки
      # проверять нечего.
      - name: Вес приложения
        run: npm run check:size

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Скорость и доступность опубликованного лендинга ──────────
  #
  # Замер живого сайта, а не сборки: судья открывает адрес, а не папку.
  # Пороги лежат в lighthouserc.json и взяты по факту — 06.09.2026 сайт
  # дал 100 из 100 по всем четырём категориям, порог поставлен чуть ниже.
  #
  # Зачем шаг, если и так сто. Скорость падает молча: тяжёлая картинка,
  # новый внешний скрипт, забытый preconnect — на быстром ноутбуке
  # разницы не видно, а сайт открывают с телефона на чужом вайфае.
  #
  # Шаг не блокирует публикацию: она уже произошла. Он красит прогон в
  # красный, и это видно в списке — ровно то, что нужно, чтобы заметить.
  speed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Странице нужно доехать до раздачи: Pages отвечает не мгновенно
      # после deploy-pages, и первый замер иногда попадает в старую
      # версию или в 404.
      - name: Подождать раздачу
        run: sleep 45

      - name: Замер лендинга
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
