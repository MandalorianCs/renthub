# Проверки согласия при каждом пуше и в каждом PR.
#
# Зачем. Проверок в проекте набралось пять, и все они держатся на том, что
# человек вспомнит их запустить. Ровно так же держалось согласие правил до
# них — комментарием «обязано совпадать», — и ровно так же однажды не
# сработает.
#
# Что проверяется здесь и почему именно это:
#
#   typecheck    типы приложения
#   check:bot    имена в боте, загрузка модуля, правило телефона в трёх
#                языках, ссылка на объявление в двух, списки статусов
#                против текста функции в миграции
#   check:pitch  арифметика деки и числа продукта
#
# Чего здесь нет и почему. `check:errors` спрашивает живую базу — ему нужен
# секретный ключ, а класть ключ проекта в CI ради проверки текстов дороже
# самой проверки. Он остаётся локальным: `npm run check` перед пушем.
#
# `check:pitch` умеет обе половины: без ключа сверяет тексты с кодом и
# миграциями, с ключом — ещё и с живыми настройками. Здесь работает первая.
#
# Стенд миграций (`npm run test:db`) тоже не здесь: он поднимает Postgres в
# Docker и идёт двадцать секунд, а его правило — «зелёный стенд перед пушем
# миграции» — про другое действие и другой момент.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python нужен check:bot — он разбирает bot.py по дереву и импортирует
      # модуль целиком. Зависимостей бота при этом не ставим: импорт без них
      # остановится сам, и проверка честно скажет «пропущена».
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Бот против базы
        run: npm run check:bot

      - name: Числа деки
        run: npm run check:pitch
